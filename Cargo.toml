[package]
name = "rvbench-cli"
version = "0.1.0"
edition = "2024"
description = "RISC-V benchmark contracts and evaluation client"
repository = "https://github.com/rvbench/rvbench-cli"

[lib]
name = "rvbench_cli"
path = "src/lib.rs"

# 两个入口共用 src/cli.rs；CARGO_BIN_EXE_rvbench 依赖显式声明的 bin 名。
[[bin]]
name = "rvbench"
path = "src/main.rs"

[[bin]]
name = "rb-cli"
path = "src/bin/rb-cli.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
jsonschema = { version = "0.49.9", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rvbench-protocol = { git = "https://github.com/rvbench/rvbench-core-rust.git", rev = "6dbacf8d9d24140c6436e08fd8c495ef0b9793bc" }
serde_json = { version = "1", features = ["arbitrary_precision", "float_roundtrip"] }
tar = "0.4"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
