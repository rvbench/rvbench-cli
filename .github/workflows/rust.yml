name: Rust
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo run --locked --bin rvbench -- validate spec examples/hello-world/spec.json
      - run: cargo run --locked --bin rvbench -- validate results examples/hello-world/eval_results.json --spec examples/hello-world/spec.json
      - run: cargo run --locked --bin rvbench -- validate spec examples/baseline/spec.json
      - run: cargo run --locked --bin rvbench -- validate baseline-results examples/baseline/baseline-results.json --spec examples/baseline/spec.json
      - run: cargo run --locked --bin rb-cli -- digest examples/baseline/spec.json --baseline torch_abs
